; Pact x M5StackChan (SKU:K151) - CoreS3 / ESP32-S3
;
; ESP-IDF, not Arduino. The reason is specific: the two capabilities this
; robot needs most - esp-dl (on-device face detection) and esp-sr (two-mic
; direction of arrival) - are ESP-IDF components with no Arduino equivalent.
; Face detection was removed from arduino-esp32 core 3.x entirely.
[env:stackchan]
platform  = espressif32
board     = m5stack-cores3
framework = espidf

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, direct
upload_speed    = 1500000

board_build.partitions = partitions.csv

; Capture mode: hold the head still and stream every frame to the host, so
; the detector can be rewritten and re-judged against recorded data instead
; of by reflashing and asking a human whether it felt right.
[env:capture]
extends     = env:stackchan
build_flags = -DPACT_CAPTURE

; Same, plus a full sweep of each axis at startup, one frame per stop.
; That montage is how "which servo position looks straight ahead?" gets
; answered by looking - the middle of the pitch travel aims at the ceiling.
[env:sweep]
extends     = env:stackchan
build_flags = -DPACT_CAPTURE -DPACT_SWEEP
