<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pact — wall</title>
<meta name="description" content="Live feed wall. Every device that is streaming right now.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pact.css">
</head>
<body>

<div class="shell">

  <header class="bar">
    <a class="brand" href="/">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M10 1.4 17.4 5.7v8.6L10 18.6 2.6 14.3V5.7z"
              fill="none" stroke="#9e3340" stroke-width="1.4"/>
        <path d="M5.8 12.1h8.4" stroke="#e9e6e0" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <b>pact</b>
    </a>

    <div class="bar-stats">
      <span><i id="stat-live">0</i> live</span>
      <span id="stat-clock">--:--:--</span>
    </div>
  </header>

  <aside class="rail">
    <div class="rail-head">
      Devices
      <span id="rail-count">0</span>
    </div>

    <ul class="rail-list" id="rail-list"></ul>

    <div class="rail-foot">
      <button class="btn btn-primary" id="add-device">Add a device</button>
    </div>
  </aside>

  <main class="wall" id="wall"></main>

</div>

<dialog id="claim-dialog">
  <div class="dlg">
    <h2>Add a device</h2>
    <p>Open this on the phone, laptop or tablet you want to stream from. The code works once, for ten minutes.</p>

    <div class="qr" id="claim-qr"></div>
    <div class="code" id="claim-code">----</div>
    <div class="join-url" id="claim-url"></div>

    <div class="dlg-actions">
      <button class="btn" id="claim-copy">Copy link</button>
      <button class="btn btn-ghost" id="claim-close">Done</button>
    </div>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module" src="/js/wall.js"></script>
</body>
</html>
