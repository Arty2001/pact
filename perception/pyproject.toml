[project]
name = "pact-perception"
version = "0.1.0"
description = "Frame sampling, embedding, skill scoring and state machines for pact."
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.1",
  "pillow>=11.0",
  "websockets>=14.0",
  "httpx>=0.28",
]

[project.optional-dependencies]
# The encoder. Split out so the state machine and its tests can be installed
# and run without a 550 MB checkpoint, which is what keeps `pytest` fast.
encoder = [
  "torch>=2.4",
  "timm>=1.0",
  "einops>=0.8",
  "transformers>=4.49,<5",
  "sentencepiece>=0.2",
  "protobuf>=5.0",
]
# Pulling a camera off the SFU, which is what `--source sfu` does and what
# the watcher runs in. These were installed by hand on one laptop and
# declared nowhere, so `--source sfu` worked there and nowhere else: a
# container built from this file crashed on the first frame with
# ModuleNotFoundError. aiortc does the WebRTC; av is the decoder under it,
# and the pair only handle H264 and VP8, which is why the publisher pins
# its codec.
sfu = ["aiortc>=1.15", "av>=17.1"]
camera = ["opencv-python-headless>=4.10"]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pact_perception"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
