# Check every pull request. Deploy on demand.
#
# The deploy job depends on the check job, so a red build cannot reach
# pact.lanvar.ai. That ordering is the whole point of the file: with two
# people merging to main, the thing standing between a typo and production
# should be a machine rather than whoever pushed last.
#
# Deploying is automatic on main, and skips itself when it cannot work. A
# merge deploys; a repo without credentials reports the deploy as skipped
# rather than failed, because a workflow that is always red is a workflow
# everyone learns to scroll past. Add CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID as repository secrets and the next merge ships
# itself - nothing else to change.
#
# What this does NOT do is touch the Worker's runtime secrets. REALTIME_APP_ID,
# REALTIME_APP_SECRET and NEBIUS_API_KEY are set once with `wrangler secret put`
# and live on the Worker, not in the repo or in this workflow. A deploy leaves
# them alone, so there is no way for this file to leak or clobber them.

name: check and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Deploy on demand, from the Actions tab.
  workflow_dispatch:

# A second push to main while the first is still deploying should win rather
# than race it. In-progress PR checks are cancelled; in-progress deploys are
# not, because killing wrangler mid-upload is how you get a half-applied
# migration.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Secrets cannot be read in a job-level `if`, so whether we are able to
  # deploy is decided in a step and carried out as an output.
  credentials:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.probe.outputs.ready }}
    steps:
      - id: probe
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cloudflare credentials set, so this merge will not deploy. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy on every merge to main."
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24 to match local. The test script uses --experimental-strip-types,
          # which needs 22.6 or newer; anything older fails on the TypeScript
          # test files rather than on the code under test.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  deploy:
    needs: [check, credentials]
    # Every merge to main, and on demand - but only once the credentials
    # exist. `check` is in `needs`, so a red build cannot reach production.
    if: >-
      needs.credentials.outputs.ready == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    # Named so the deploy shows up in the repo's Environments tab with a link
    # to the live URL, and so branch protection can require it later.
    environment:
      name: production
      url: https://pact.lanvar.ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Deploy to Cloudflare
        # npx uses the wrangler pinned in devDependencies, so CI and a local
        # `npm run deploy` run the same version. Letting CI float to latest is
        # how a deploy starts failing on a day nobody changed anything.
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
